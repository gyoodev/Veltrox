<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Veltrox</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #090d16;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }
      .shell {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        gap: 16px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #0b1120;
        border: 2px solid rgba(59, 130, 246, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 32px rgba(59, 130, 246, 0.2);
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 340px;
        font-size: 0.92rem;
        line-height: 1.5;
        color: #94a3b8;
      }
      .actions {
        margin-top: 8px;
        display: flex;
        gap: 12px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
      }
      button:active {
        opacity: 0.9;
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 128 128" width="44" height="44" fill="none">
          <defs>
            <linearGradient
              id="vGrad"
              x1="16"
              y1="16"
              x2="112"
              y2="112"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <path
            d="M32 34L64 96L96 34H80L64 66L48 34H32Z"
            fill="url(#vGrad)"
          />
        </svg>
      </div>
      <h1>Veltrox</h1>
      <p id="status-msg">
        Unable to reach Veltrox servers. Check your internet connection and
        try again.
      </p>
      <div class="actions">
        <button id="retry-btn" type="button">Reconnect / Опитай отново</button>
      </div>
    </main>
    <script>
      (function () {
        var targetUrl = "https://veltrox-one.vercel.app";
        var msg = document.getElementById("status-msg");
        if (navigator.language && navigator.language.toLowerCase().startsWith("bg")) {
          msg.textContent =
            "Няма връзка със сървърите на Veltrox. Проверете интернет връзката и опитайте отново.";
        }
        document.getElementById("retry-btn").addEventListener("click", function () {
          window.location.replace(targetUrl);
        });
      })();
    </script>
  </body>
</html>
